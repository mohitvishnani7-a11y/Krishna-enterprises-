<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krishna Enterprises Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f3f5f9;color:#182033;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 3px 14px #0001}
h1{font-size:24px}h2{font-size:19px}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccd2df}
button{border:0;background:#172554;color:white;font-weight:bold}
.delete{background:#b42318}.secondary{background:#475569}
.muted{color:#64748b;font-size:14px}.status{padding:8px 0;overflow-wrap:anywhere}
.product{border-top:1px solid #ddd;padding:14px 0;overflow-wrap:anywhere}
.preview{width:120px;height:120px;object-fit:contain;background:#f5f5f5;border-radius:8px;display:block}
.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Krishna Enterprises</h1>
<p class="muted">Product & Inventory Admin Panel</p>
<div id="status" class="status">Firebase connect ho raha hai...</div>

<section id="loginCard" class="card">
<h2>Admin Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</section>

<section id="panel" class="hidden">
<div class="card">
<h2>Naya Product Jodein</h2>
<form id="productForm">
<input id="name" placeholder="Product name / model" required>
<input id="category" placeholder="Category, jaise Earbuds" required>
<div style="border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:10px">
  <h3>➕ नई Category जोड़ें</h3>
  <input id="newCategory" type="text"
         placeholder="Category ka naam, jaise Bluetooth Speakers">
  <button id="saveCategory" type="button">Category Save Karein</button>
  <div id="categoryStatus"></div>
  <div id="categoryList"></div>
</div>  
<div class="grid">
<input id="price" type="number" min="0" step="0.01" placeholder="Price (₹)" required>
<input id="stock" type="number" min="0" step="1" placeholder="Stock" required>
</div>
<label for="imageFile">Product photo (Gallery se chunein)</label>
<input id="imageFile" type="file" accept="image/*">
<p class="muted">Photo automatically chhoti JPEG image mein convert hogi.</p>
<img id="newPreview" class="preview hidden" alt="Photo preview">
<button id="saveButton" type="submit">Product Save Karein</button>
</form>
  <div class="card">
  <h2>🎉 Offers & Festival Sale</h2>

  <label>Offer Name</label>
  <input id="offerName" placeholder="Diwali Sale" />

  <label>Offer Type</label>
  <select id="offerType">
    <option value="global">All Products</option>
    <option value="product">Selected Product</option>
  </select>

  <label>Product Name (selected product ke liye)</label>
  <input id="offerProduct" placeholder="Exact product name" />

  <label>Discount Percentage (%)</label>
  <input id="offerDiscount" type="number"
         min="1" max="90" placeholder="20" />

  <label>Start Date</label>
  <input id="offerStart" type="date" />

  <label>End Date</label>
  <input id="offerEnd" type="date" />

  <label>Offer Status</label>
  <select id="offerEnabled">
    <option value="true">Enabled</option>
    <option value="false">Disabled</option>
  </select>

  <button id="saveOffer" type="button">Save Offer</button>
  <div id="offerStatus" class="muted"></div>
  <div id="offersList"></div>
  </div>
</div>

<div class="card">
<h2>Inventory / Maujooda Products</h2>
<button id="refresh" class="secondary" type="button">Refresh List</button>
<div id="products">Products load ho rahe hain...</div>
</div>
<div class="card"><button id="logout" class="secondary" type="button">Logout</button></div>
</section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBHw8LCel_C3dcRnU3XhzwO0B6bKkYl4tk",
  authDomain: "krishna-enterprises-d2672.firebaseapp.com",
  projectId: "krishna-enterprises-d2672",
  storageBucket: "krishna-enterprises-d2672.firebasestorage.app",
  messagingSenderId: "632665490522",
  appId: "1:632665490522:web:9239bdeec69b3d39b84463"
};
const ADMIN_UID = "ZEBSPIhm9Ve0Bcvi26CdbmZ6cyi1";
const $ = id => document.getElementById(id);
let auth, db, currentUser = null, selectedImage = "";

function message(t){$("status").textContent=t}
function showError(e){
  console.error(e);
  message("Error: "+(e.message || "Dobara try karein."));
}

try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  message("Firebase ready. Admin login karein.");
}catch(e){showError(e)}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith("image/")){
      reject(new Error("Image file chunein."));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Photo read nahi hui."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Photo open nahi hui."));
      img.onload=()=>{
        const max=600;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        let quality=0.65;
        let data=canvas.toDataURL("image/jpeg",quality);
        while(data.length>260000 && quality>0.30){
          quality-=0.10;
          data=canvas.toDataURL("image/jpeg",quality);
        }
        if(data.length>260000){
          reject(new Error("Photo abhi bhi badi hai. Chhoti photo chunein."));
          return;
        }
        resolve(data);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

$("imageFile").addEventListener("change",async()=>{
  selectedImage="";
  $("newPreview").classList.add("hidden");
  const file=$("imageFile").files[0];
  if(!file)return;
  try{
    message("Photo compress ho rahi hai...");
    selectedImage=await compressImage(file);
    $("newPreview").src=selectedImage;
    $("newPreview").classList.remove("hidden");
    message("Photo ready hai. Product save kar sakte hain.");
  }catch(e){showError(e)}
});

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const result=await auth.signInWithEmailAndPassword(
      $("email").value.trim(),$("password").value
    );
    if(result.user.uid!==ADMIN_UID){
      await auth.signOut();
      message("Is account ko Admin permission nahi hai.");
      return;
    }
    message("Admin login successful.");
  }catch(e){showError(e)}
});

auth.onAuthStateChanged(async user=>{
  currentUser=user;
  const allowed=!!user && user.uid===ADMIN_UID;
  $("loginCard").classList.toggle("hidden",allowed);
  $("panel").classList.toggle("hidden",!allowed);
  if(user&&!allowed){
    await auth.signOut();
    message("Admin permission nahi hai.");
    return;
  }
  if(allowed)await loadProducts();
});

async function loadProducts(){
  $("products").textContent="Products load ho rahe hain...";
  try{
    const snap=await db.collection("products").get();
    $("products").innerHTML="";
    if(snap.empty){$("products").textContent="Abhi koi product nahi hai.";return}
    snap.forEach(doc=>{
      const p=doc.data();
      const item=document.createElement("div");
      item.className="product";

      const title=document.createElement("strong");
      title.textContent=p.name||"Unnamed product";
      item.appendChild(title);

      if(p.image){
        const img=document.createElement("img");
        img.className="preview";
        img.src=p.image;
        img.alt=p.name||"Product";
        item.appendChild(img);
      }

      const details=document.createElement("p");
      details.textContent="Category: "+(p.category||"—")+
        " | Price: ₹"+(p.price??"—")+" | Stock: "+(p.stock??"—");
      item.appendChild(details);

      const edit=document.createElement("button");
      edit.type="button";
      edit.textContent="Edit Price / Stock";
      edit.addEventListener("click",async()=>{
        const pr=prompt("Nayi price (₹):",p.price??"");
        if(pr===null)return;
        const st=prompt("Naya stock:",p.stock??0);
        if(st===null)return;
        const price=Number(pr),stock=Number(st);
        if(pr.trim()===""||!Number.isFinite(price)||price<0||
           st.trim()===""||!Number.isInteger(stock)||stock<0){
          alert("Sahi price aur stock bharein.");return;
        }
        try{
          await db.collection("products").doc(doc.id).update({price,stock});
          message("Price aur stock update ho gaye.");
          await loadProducts();
        }catch(e){showError(e)}
      });
      item.appendChild(edit);

      const photoInput=document.createElement("input");
      photoInput.type="file";
      photoInput.accept="image/*";
      photoInput.setAttribute("aria-label","Nayi product photo chunein");
      item.appendChild(photoInput);

      const photoButton=document.createElement("button");
      photoButton.type="button";
      photoButton.textContent="Photo Badlein";
      photoButton.addEventListener("click",async()=>{
        const file=photoInput.files[0];
        if(!file){alert("Pehle Gallery se photo chunein.");return}
        try{
          message("Photo compress ho rahi hai...");
          const image=await compressImage(file);
          await db.collection("products").doc(doc.id).update({image});
          message("Product photo update ho gayi.");
          await loadProducts();
        }catch(e){showError(e)}
      });
      item.appendChild(photoButton);

      const remove=document.createElement("button");
      remove.type="button";
      remove.className="delete";
      remove.textContent="Product Delete Karein";
      remove.addEventListener("click",async()=>{
        if(!confirm("Kya product delete karna hai?"))return;
        try{
          await db.collection("products").doc(doc.id).delete();
          message("Product delete ho gaya.");
          await loadProducts();
        }catch(e){showError(e)}
      });
      item.appendChild(remove);
      $("products").appendChild(item);
    });
  }catch(e){showError(e)}
}

$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!currentUser||currentUser.uid!==ADMIN_UID){
    message("Pehle Admin login karein.");return;
  }
  const name=$("name").value.trim();
  const category=$("category").value.trim();
  const price=Number($("price").value);
  const stock=Number($("stock").value);
  if(!name||!category||!Number.isFinite(price)||price<0||
     !Number.isInteger(stock)||stock<0){
    message("Naam, category, sahi price aur stock bharein.");return;
  }
  if($("imageFile").files.length&&!selectedImage){
    message("Photo process ho rahi hai; kuch der baad save karein.");return;
  }
  try{
    $("saveButton").disabled=true;
    const product={name,category,price,stock,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(selectedImage)product.image=selectedImage;
    await db.collection("products").add(product);
    e.target.reset();
    selectedImage="";
    $("newPreview").src="";
    $("newPreview").classList.add("hidden");
    message("Product Firebase mein save ho gaya.");
    await loadProducts();
  }catch(e){showError(e)}
  finally{$("saveButton").disabled=false}
});

$("refresh").addEventListener("click",loadProducts);
$("logout").addEventListener("click",()=>auth.signOut());
  
async function loadOffers() {
  const list = document.getElementById("offersList");
  if (!list || !db) return;

  try {
    const snap = await db.collection("offers").get();

    list.innerHTML = "";

    snap.forEach(doc => {
      const o = doc.data();
      const card = document.createElement("div");
      card.className = "product";

      const title = document.createElement("b");
      title.textContent = o.name || "Offer";
      card.appendChild(title);

      const info = document.createElement("p");
      info.textContent =
        (o.type === "global" ? "All Products" : "Product: " + (o.productName || "")) +
        " | Discount: " + (Number(o.discount) || 0) + "%" +
        " | " + (o.startDate || "Any date") + " to " + (o.endDate || "Any date") +
        " | " + (o.enabled ? "Enabled" : "Disabled");
      card.appendChild(info);

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.textContent = o.enabled ? "Disable" : "Enable";
      toggle.onclick = async () => {
        try {
          await db.collection("offers").doc(doc.id)
            .update({ enabled: !o.enabled });
          await loadOffers();
        } catch (e) {
          alert("Offer status update nahi hua: " + e.message);
        }
      };
      card.appendChild(toggle);

      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "Delete";
      del.onclick = async () => {
        if (!confirm("Kya ye offer delete karna hai?")) return;
        try {
          await db.collection("offers").doc(doc.id).delete();
          await loadOffers();
        } catch (e) {
          alert("Offer delete nahi hua: " + e.message);
        }
      };
      card.appendChild(del);
      list.appendChild(card);
    });
  } catch (e) {
    console.error(e);
    document.getElementById("offerStatus").textContent =
      "Offers load nahi hue: " + e.message;
  }
}

document.getElementById("saveOffer").addEventListener("click", async () => {
  const status = document.getElementById("offerStatus");

  const name = document.getElementById("offerName").value.trim();
  const type = document.getElementById("offerType").value;
  const productName = document.getElementById("offerProduct").value.trim();
  const discount = Number(document.getElementById("offerDiscount").value);
  const startDate = document.getElementById("offerStart").value;
  const endDate = document.getElementById("offerEnd").value;
  const enabled = document.getElementById("offerEnabled").value === "true";

  if (!name || !Number.isFinite(discount) || discount <= 0 || discount > 90) {
    alert("Offer name aur 1 se 90 tak discount percentage bharein.");
    return;
  }

  if (type === "product" && !productName) {
    alert("Selected product ka exact naam bharein.");
    return;
  }

  if (startDate && endDate && endDate < startDate) {
    alert("End date, start date se pehle nahi ho sakti.");
    return;
  }

  try {
    status.textContent = "Offer save ho raha hai...";
    await db.collection("offers").add({
      name, type, productName, discount,
      startDate, endDate, enabled,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    status.textContent = "Offer Firestore mein save ho gaya!";
    document.getElementById("offerName").value = "";
    document.getElementById("offerProduct").value = "";
    document.getElementById("offerDiscount").value = "";
    await loadOffers();
  } catch (e) {
    console.error(e);
    status.textContent = "Save nahi hua: " + e.message;
  }
});

async function loadCategories() {
  const list = document.getElementById("categoryList");
  if (!list) return;

  try {
    const snapshot = await db.collection("categories").get();
    list.innerHTML = "";

    snapshot.forEach((doc) => {
      const data = doc.data();
      const name = data.name || "";
      if (!name) return;

      const item = document.createElement("div");
      item.textContent = "• " + name;
      list.appendChild(item);
    });
  } catch (error) {
    console.error(error);
    document.getElementById("categoryStatus").textContent =
      "Categories load nahi hui: " + error.message;
  }
}

document.getElementById("saveCategory").addEventListener("click", async () => {
  const input = document.getElementById("newCategory");
  const status = document.getElementById("categoryStatus");
  const name = input.value.trim();

  if (!name) {
    status.textContent = "Pehle category ka naam likhein.";
    return;
  }

  try {
    status.textContent = "Category save ho rahi hai...";

    const existing = await db.collection("categories")
      .where("name", "==", name).get();

    if (!existing.empty) {
      status.textContent = "Yeh category pehle se maujood hai.";
      return;
    }

    await db.collection("categories").add({
      name: name,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    status.textContent = "Category Firebase mein save ho gayi!";
    input.value = "";
    await loadCategories();
  } catch (error) {
    console.error(error);
    status.textContent = "Save nahi hui: " + error.message;
  }
});

loadCategories();
  
loadOffers();
  
</script>
</body>
</html>
