
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krishna Enterprises - Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: #f3f5f9;
      color: #182033; font-family: Arial, sans-serif;
    }
    .wrap { max-width: 760px; margin: auto; }
    .card {
      background: white; padding: 18px; margin: 14px 0;
      border-radius: 14px; box-shadow: 0 3px 14px #0000000c;
    }
    h1 { font-size: 25px; margin: 4px 0 8px; }
    h2 { font-size: 19px; }
    input, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border-radius: 8px; font-size: 16px;
    }
    input { border: 1px solid #ccd2df; }
    button {
      border: 0; background: #172554; color: white;
      font-weight: bold; cursor: pointer;
    }
    button.delete { background: #b42318; }
    button.secondary { background: #475569; }
    .muted { color: #64748b; font-size: 14px; }
    .status { padding: 10px 0; overflow-wrap: anywhere; }
    .product { border-top: 1px solid #e2e8f0; padding: 12px 0; }
    .product strong { font-size: 17px; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media(max-width: 420px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Krishna Enterprises</h1>
  <p class="muted">Secure Product Admin Panel</p>
  <div id="status" class="status">Firebase कनेक्ट हो रहा है...</div>

  <section id="loginCard" class="card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p class="muted">Firebase Authentication में बनाए गए Admin email और password का उपयोग करें।</p>
  </section>

  <section id="panel" class="hidden">
    <div class="card">
      <h2>नया प्रोडक्ट जोड़ें</h2>
      <form id="productForm">
        <input id="name" placeholder="प्रोडक्ट का नाम / मॉडल" required>
        <input id="category" placeholder="कैटेगरी, जैसे Earbuds" required>
        <div class="grid">
          <input id="price" type="number" min="0" step="0.01" placeholder="कीमत (₹)" required>
          <input id="stock" type="number" min="0" step="1" placeholder="स्टॉक संख्या" required>
        </div>
        <button type="submit">प्रोडक्ट Firebase में सेव करें</button>
      </form>
    </div>

    <div class="card">
      <h2>मौजूदा प्रोडक्ट्स</h2>
      <p class="muted">किसी प्रोडक्ट की कीमत या स्टॉक बदलने के लिए Edit दबाएँ।</p>
      <button id="refresh" class="secondary" type="button">लिस्ट रीफ्रेश करें</button>
      <div id="products">प्रोडक्ट लोड हो रहे हैं...</div>
    </div>

    <div class="card">
      <button id="logout" class="secondary" type="button">Logout</button>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBHw8LCel_C3dcRnU3XhzwO0B6bKkYl4tk",
  authDomain: "krishna-enterprises-d2672.firebaseapp.com",
  projectId: "krishna-enterprises-d2672",
  storageBucket: "krishna-enterprises-d2672.firebasestorage.app",
  messagingSenderId: "632665490522",
  appId: "1:632665490522:web:9239bdeec69b3d39b84463"
};

const ADMIN_UID = "ZEBSPIhm9Ve0Bcvi26CdbmZ6cyi1";

const statusBox = document.getElementById("status");
const loginCard = document.getElementById("loginCard");
const panel = document.getElementById("panel");
const productsBox = document.getElementById("products");
let auth, db, currentUser = null;

function message(text) {
  statusBox.textContent = text;
}

function showError(error) {
  console.error(error);
  message("त्रुटि: " + (error.message || "कृपया फिर कोशिश करें।"));
}

try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  message("Firebase तैयार है। Admin login करें।");
} catch (error) {
  showError(error);
}

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    const result = await auth.signInWithEmailAndPassword(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
    if (result.user.uid !== ADMIN_UID) {
      await auth.signOut();
      message("इस अकाउंट को Admin की अनुमति नहीं है।");
      return;
    }
    message("Admin login सफल!");
  } catch (error) {
    showError(error);
  }
});

auth && auth.onAuthStateChanged(async user => {
  currentUser = user;
  const allowed = !!user && user.uid === ADMIN_UID;
  loginCard.classList.toggle("hidden", allowed);
  panel.classList.toggle("hidden", !allowed);

  if (user && !allowed) {
    await auth.signOut();
    message("इस अकाउंट को Admin की अनुमति नहीं है।");
    return;
  }
  if (allowed) await loadProducts();
});

async function loadProducts() {
  productsBox.textContent = "लोड हो रहा है...";
  try {
    const snapshot = await db.collection("products").get();
    productsBox.innerHTML = "";
    if (snapshot.empty) {
      productsBox.textContent = "अभी कोई प्रोडक्ट नहीं है।";
      return;
    }

    snapshot.forEach(doc => {
      const p = doc.data();
      const item = document.createElement("div");
      item.className = "product";

      const title = document.createElement("strong");
      title.textContent = p.name || "बिना नाम का प्रोडक्ट";
      item.appendChild(title);

      const details = document.createElement("p");
      details.textContent =
        "कैटेगरी: " + (p.category || "—") +
        " | कीमत: ₹" + (p.price ?? "नहीं दी गई") +
        " | स्टॉक: " + (p.stock ?? "नहीं दिया गया");
      item.appendChild(details);

      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "Edit कीमत / स्टॉक";
      edit.addEventListener("click", async () => {
        const newPrice = prompt("नई कीमत (₹):", p.price ?? "");
        if (newPrice === null) return;
        const newStock = prompt("नया स्टॉक:", p.stock ?? 0);
        if (newStock === null) return;

        const priceNumber = Number(newPrice);
        const stockNumber = Number(newStock);
        if (newPrice.trim() === "" || !Number.isFinite(priceNumber) ||
            priceNumber < 0 || newStock.trim() === "" ||
            !Number.isInteger(stockNumber) || stockNumber < 0) {
          alert("सही कीमत और शून्य या उससे अधिक पूर्ण संख्या वाला स्टॉक डालें।");
          return;
        }

        try {
          await db.collection("products").doc(doc.id).update({
            price: priceNumber,
            stock: stockNumber
          });
          message("प्रोडक्ट अपडेट हो गया।");
          await loadProducts();
        } catch (error) { showError(error); }
      });
      item.appendChild(edit);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "delete";
      remove.textContent = "प्रोडक्ट हटाएँ";
      remove.addEventListener("click", async () => {
        if (!confirm("क्या यह प्रोडक्ट हटाना चाहते हैं?")) return;
        try {
          await db.collection("products").doc(doc.id).delete();
          message("प्रोडक्ट हटाया गया।");
          await loadProducts();
        } catch (error) { showError(error); }
      });
      item.appendChild(remove);
      productsBox.appendChild(item);
    });
  } catch (error) { showError(error); }
}

document.getElementById("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser || currentUser.uid !== ADMIN_UID) {
    message("पहले Admin login करें।");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value.trim();
  const price = Number(document.getElementById("price").value);
  const stock = Number(document.getElementById("stock").value);

  if (!name || !category || !Number.isFinite(price) || price < 0 ||
      !Number.isInteger(stock) || stock < 0) {
    message("नाम, कैटेगरी, सही कीमत और स्टॉक भरें।");
    return;
  }

  try {
    await db.collection("products").add({
      name, category, price, stock,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    event.target.reset();
    message("नया प्रोडक्ट Firebase में सेव हो गया।");
    await loadProducts();
  } catch (error) { showError(error); }
});

document.getElementById("refresh").addEventListener("click", loadProducts);
document.getElementById("logout").addEventListener("click", () => auth.signOut());
</script>
</body>
</html>
